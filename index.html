<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Library Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 College Library Tracker</h1>
      <p>Keep track of your borrowed books and receive automated email reminders!</p>
    </header>

    <!-- Issue Book Section -->
    <div class="card">
      <h2>Issue New Book</h2>
      <form id="book-form">
        <div class="form-group">
          <label for="book-title">Book Title</label>
          <input type="text" id="book-title" placeholder="e.g. Data Structures & Algorithms" required>
        </div>

        <div class="form-group">
          <label for="issue-date">Issue Date</label>
          <input type="date" id="issue-date" required>
        </div>

        <div class="form-group">
          <label for="user-email">Your Email (For Reminders)</label>
          <input type="email" id="user-email" placeholder="e.g. student@example.com" required>
        </div>

        <button type="submit" class="btn">Add Book & Set Reminder</button>
      </form>
    </div>

    <!-- Borrowed Books List Section -->
    <div class="card">
      <div class="list-header">
        <h2>My Borrowed Books (<span id="book-count">0</span>)</h2>
        <input type="text" id="search-input" placeholder="🔍 Search book...">
      </div>
      <div id="book-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
